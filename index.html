    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: 'Tajawal', sans-serif;
      color: var(--text-main);
      background: radial-gradient(circle at 15% 20%, #1da7ff 0%, #0157b0 40%, #022b5d 100%);
      overflow-x: hidden;
    }

    .hero {
      position: relative;
      min-height: 100vh;
      padding: 40px 20px 28px;
      display: grid;
      place-items: center;
      isolation: isolate;
    }

    .hero::before,
    .hero::after {
      content: "";
      position: absolute;
      border-radius: 999px;
      filter: blur(30px);
      z-index: -2;
      opacity: 0.5;
    }

    .hero::before {
      width: 420px;
      height: 420px;
      right: -120px;
      top: -90px;
      background: #52e3ff;
    }

    .hero::after {
      width: 320px;
      height: 320px;
      left: -110px;
      bottom: -120px;
      background: #7d7bff;
    }

    .floating-logo-bg {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: -1;
    }

    .logo-instance {
      position: absolute;
      width: 76px;
      aspect-ratio: 1;
      background: var(--logo-image) center/cover no-repeat;
      opacity: 0.12;
      animation: logoFloat 18s linear infinite;
    }

    @keyframes logoFloat {
      from { transform: translateY(0) rotate(0deg); }
      to { transform: translateY(-520px) rotate(45deg); }
    }

    .card {
      width: min(780px, 100%);
      border: 1px solid rgba(255, 255, 255, 0.22);
      background: linear-gradient(160deg, rgba(255, 255, 255, 0.22), rgba(255, 255, 255, 0.07));
      box-shadow: 0 25px 70px rgba(0, 17, 36, 0.4);
      border-radius: 24px;
      backdrop-filter: blur(8px);
      padding: clamp(20px, 4vw, 34px);
    }

    .top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
    }

    .badge {
      border: 1px solid rgba(255, 255, 255, 0.35);
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-soft);
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 0.95rem;
      font-weight: 700;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #dbffe3;
      font-weight: 700;
      font-size: 0.95rem;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 0 6px rgba(32, 201, 151, 0.18);
    }

    h1 {
      margin: 18px 0 8px;
      font-size: clamp(1.7rem, 5vw, 2.6rem);
      line-height: 1.35;
    }

    p {
      margin: 0;
      color: var(--text-soft);
      line-height: 1.8;
      font-size: 1.05rem;
    }

    .quick-actions {
      margin-top: 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .chip {
      border: 1px solid rgba(255, 255, 255, 0.24);
      background: var(--surface);
      color: #fff;
      border-radius: 999px;
      padding: 8px 14px;
      cursor: pointer;
      font: inherit;
      transition: 0.25s ease;
    }

    .chip:hover,
    .chip.active {
      background: var(--surface-strong);
      transform: translateY(-1px);
    }

    .visual {
      margin: 22px 0;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
    }

    .visual img {
      width: 100%;
      display: block;
      max-height: 260px;
      object-fit: cover;
    }

    .cta-grid {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: stretch;
    }

    .cta-button,
    .copy-btn {
      border: 0;
      font: inherit;
      border-radius: 14px;
      font-weight: 800;
      cursor: pointer;
      transition: 0.25s ease;
      text-decoration: none;
      text-align: center;
    }

    .cta-button {
      background: linear-gradient(135deg, var(--brand-primary), var(--brand-accent));
      color: white;
      padding: 15px;
      box-shadow: 0 10px 28px rgba(1, 123, 239, 0.35);
    }

    .cta-button:hover {
      transform: translateY(-2px);
      filter: brightness(1.05);
    }

    .copy-btn {
      padding: 0 16px;
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.35);
      background: rgba(255, 255, 255, 0.12);
      min-width: 110px;
    }

    .copy-btn:hover {
      background: rgba(255, 255, 255, 0.22);
    }

    .hint {
      margin-top: 10px;
      font-size: 0.95rem;
      color: #d7edff;
      min-height: 22px;
    }

    footer {
      margin-top: 18px;
      color: #e6f3ff;
      font-size: 0.95rem;
      text-align: center;
    }

    @media (max-width: 680px) {
      .cta-grid {
        grid-template-columns: 1fr;
      }

      .copy-btn {
        padding: 12px 16px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <section class="hero">
    <div class="floating-logo-bg" aria-hidden="true">
      <span class="logo-instance" style="right: 8%; bottom: -80px; animation-delay: 0s;"></span>
      <span class="logo-instance" style="right: 24%; bottom: -130px; animation-delay: 4s;"></span>
      <span class="logo-instance" style="right: 48%; bottom: -90px; animation-delay: 8s;"></span>
      <span class="logo-instance" style="right: 75%; bottom: -120px; animation-delay: 12s;"></span>
      <span class="logo-instance" style="right: 92%; bottom: -180px; animation-delay: 15s;"></span>
    </div>

    <main class="card" aria-labelledby="headline">
      <div class="top-row">
        <span class="badge">باروكات منيرة الودعاني</span>
        <span class="status"><span class="status-dot" aria-hidden="true"></span>متواجدين الآن للرد</span>
      </div>

      <h1 id="headline">تواصل سريع وواضح عبر واتساب ✨</h1>
      <p>
        حدد نوع الاستفسار من الخيارات الجاهزة، ثم اضغط زر التواصل.
        تم تحسين الصفحة لتكون أخف، أوضح، وأسهل استخدامًا على الجوال.
      </p>

      <div class="quick-actions" role="list" aria-label="رسائل جاهزة">
        <button class="chip active" data-msg="مرحباً، أود الاستفسار عن الباروكات المتوفرة حالياً.">استفسار عام</button>
        <button class="chip" data-msg="مرحباً، هل يمكن إرسال الأسعار والعروض الحالية؟">الأسعار والعروض</button>
        <button class="chip" data-msg="مرحباً، أحتاج مساعدة في اختيار النوع المناسب لي.">مساعدة بالاختيار</button>
      </div>

      <div class="visual">
        <img src="https://g.top4top.io/p_34947c0sx1.gif" alt="معاينة لخدمات التواصل" loading="lazy">
      </div>

      <div class="cta-grid">
        <a id="whatsappLink" class="cta-button" target="_blank" rel="noopener noreferrer" href="#">ابدئي المحادثة الآن</a>
        <button id="copyBtn" class="copy-btn" type="button">نسخ الرقم</button>
      </div>

      <div class="hint" id="hint" aria-live="polite">تم اختيار: استفسار عام.</div>

      <footer>صُنع بواسطة دهشة 💙</footer>
    </main>
  </section>

  <script>
    const phone = '966574049121';
    const chips = [...document.querySelectorAll('.chip')];
    const whatsappLink = document.getElementById('whatsappLink');
    const hint = document.getElementById('hint');
    const copyBtn = document.getElementById('copyBtn');

    function updateLink(message, label) {
      const encoded = encodeURIComponent(message);
      whatsappLink.href = `https://wa.me/${phone}?text=${encoded}`;
      hint.textContent = `تم اختيار: ${label}.`;
    }

    chips.forEach((chip) => {
      chip.addEventListener('click', () => {
        chips.forEach((item) => item.classList.remove('active'));
        chip.classList.add('active');
        updateLink(chip.dataset.msg, chip.textContent.trim());
      });
    });

    copyBtn.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(`+${phone}`);
        hint.textContent = 'تم نسخ الرقم بنجاح ✅';
      } catch (error) {
        hint.textContent = 'تعذر النسخ التلقائي، الرقم: +' + phone;
      }
    });

    updateLink(chips[0].dataset.msg, chips[0].textContent.trim());
  </script>
</body>
</html>
